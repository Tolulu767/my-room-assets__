<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎀 Cozy Arcade Station</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Soft Preppy Accent Background Layers -->
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>

  <div class="arcade-wrapper">
    <div class="header-navigation">
      <a href="../index.html" class="back-home-btn">🌸 Back to My Desk</a>
      <h2>🎮 Preppy Arcade Portal</h2>
    </div>

    <!-- Central Interactive Emulator Board -->
    <div class="console-box glass-base">
      <div class="console-selector">
        <button class="game-tab active" onclick="activateArcadeGame('ttt')">🌸 Tic-Tac-Toe</button>
        <button class="game-tab" onclick="activateArcadeGame('memory')">🍓 Memory Match</button>
        <button class="game-tab" onclick="activateArcadeGame('game2048')">🦄 Casual 2048</button>
      </div>

      <!-- GAME BLOCK 1: Premium Tic-Tac-Toe Deck -->
      <div id="deck-ttt" class="arcade-deck active">
        <div class="ttt-grid-canvas">
          <div class="ttt-cell" onclick="handleTTTClick(0)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(1)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(2)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(3)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(4)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(5)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(6)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(7)"></div>
          <div class="ttt-cell" onclick="handleTTTClick(8)"></div>
        </div>
        <p id="ttt-announcement" class="arcade-status">Your turn! Place an 🌸</p>
        <button class="arcade-reset-btn" onclick="clearTTTDeck()">✨ Reset Match</button>
      </div>

      <!-- GAME BLOCK 2: Fluid Memory Match Deck -->
      <div id="deck-memory" class="arcade-deck">
        <div id="memory-matrix" class="memory-matrix-layout"></div>
        <p id="memory-announcement" class="arcade-status">Find all matching pastel card pairs!</p>
        <button class="arcade-reset-btn" onclick="rebuildMemoryMatrix()">✨ Shuffle Board</button>
      </div>

      <!-- GAME BLOCK 3: High-Fidelity 2048 Console Box -->
      <div id="deck-game2048" class="arcade-deck">
        <div class="score-container-2048">Score: <span id="val-score-2048">0</span></div>
        <div class="board-2048-canvas">
          <!-- 4x4 Operational Vector Grid Nodes -->
          <div class="node-2048" id="n0"></div><div class="node-2048" id="n1"></div><div class="node-2048" id="n2"></div><div class="node-2048" id="n3"></div>
          <div class="node-2048" id="n4"></div><div class="node-2048" id="n5"></div><div class="node-2048" id="n6"></div><div class="node-2048" id="n7"></div>
          <div class="node-2048" id="n8"></div><div class="node-2048" id="n9"></div><div class="node-2048" id="n10"></div><div class="node-2048" id="n11"></div>
          <div class="node-2048" id="n12"></div><div class="node-2048" id="n13"></div><div class="node-2048" id="n14"></div><div class="node-2048" id="n15"></div>
        </div>
        <div class="control-pad-2048">
          <button class="pad-btn btn-up" onclick="processSlide2048('up')">🔼</button><br>
          <button class="pad-btn btn-left" onclick="processSlide2048('left')">◀️</button>
          <button class="pad-btn btn-right" onclick="processSlide2048('right')">▶️</button><br>
          <button class="pad-btn btn-down" onclick="processSlide2048('down')">🔽</button>
        </div>
        <button class="arcade-reset-btn" onclick="initiate2048Engine()">✨ New Game</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
