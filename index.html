<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Desk Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="dashboard-container">
    <h1 id="main-title">🎀 Desk Setup</h1>
    <p id="greeting-text" class="subtitle">✨ Welcome back to your cozy workspace! ✨</p>

    <!-- Interactive Pastel Desk -->
    <div class="desk-setup">
      <div class="desk-item laptop" onclick="clickOnDeskItem('YouTube')">
        <div class="icon">📺</div>
        <span class="label">Laptop</span>
      </div>
      <div class="desk-item notepad" onclick="clickOnDeskItem('innerFrench')">
        <div class="icon">🇫🇷</div>
        <span class="label">Notebook</span>
      </div>
      <div class="desk-item coffee" onclick="clickOnDeskItem('Gmail')">
        <div class="icon">☕</div>
        <span class="label">Coffee</span>
      </div>
      <div class="desk-item headphones" onclick="clickOnDeskItem('Spotify')">
        <div class="icon">🎵</div>
        <span class="label">Headset</span>
      </div>
      <div class="desk-item books" onclick="clickOnDeskItem('Sora')">
        <div class="icon">📚</div>
        <span class="label">Sora Books</span>
      </div>
      <div class="desk-item plant" onclick="clickOnDeskItem('Plant')">
        <div class="icon">🌱</div>
        <span class="label">Plant</span>
      </div>
    </div>

    <!-- Frosted Launcher Card -->
    <div id="glass-card" class="glass-card">
      <h2 id="portal-title">🌸 Hub Standby</h2>
      <p id="portal-desc">Tap a desk asset above to light up a connection portal!</p>
      <a id="portal-link" href="#" target="_blank" style="display: none;">🚀 Open Portal</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
